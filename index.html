<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ASS Admin Panel</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#07070a;
    color:#f5f2ed;
    font-family:Arial,Helvetica,sans-serif;
}

.header{
    min-height:78px;
    padding:18px 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:#07070a;
}

.brand h1{
    color:#e5c477;
    font:700 22px Georgia,serif;
}

.brand span{
    display:block;
    margin-top:5px;
    color:#777;
    font-size:8px;
    letter-spacing:4px;
}

.admin-label{
    padding:9px 14px;
    border:1px solid rgba(229,196,119,.3);
    border-radius:30px;
    color:#e5c477;
    font-size:8px;
    letter-spacing:2px;
}

.container{
    width:min(1250px,92%);
    margin:45px auto 80px;
}

.heading{
    margin-bottom:30px;
}

.heading small{
    color:#e5c477;
    font-size:8px;
    letter-spacing:4px;
}

.heading h2{
    margin-top:12px;
    font:700 clamp(38px,6vw,70px)/1 Georgia,serif;
}

.heading h2 span{
    color:#e5c477;
}


/* ================= OFFICE CONTROL ================= */

.office-control{
    margin-bottom:25px;
    padding:22px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    background:rgba(255,255,255,.025);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
}

.office-info small{
    display:block;
    color:#777;
    font-size:7px;
    letter-spacing:2px;
    margin-bottom:8px;
}

.office-info strong{
    font:700 22px Georgia,serif;
}

.office-help{
    margin-top:7px;
    color:#777;
    font-size:10px;
}

.office-button{
    border:0;
    border-radius:9px;
    padding:14px 22px;
    cursor:pointer;
    font-size:9px;
    font-weight:bold;
    letter-spacing:1.5px;
    transition:.2s;
}

.office-button:hover{
    transform:translateY(-2px);
}

.office-open{
    background:#e5c477;
    color:#111;
}

.office-closed{
    background:#29151b;
    color:#e58b9b;
    border:1px solid rgba(229,139,155,.25);
}


/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:30px;
}

.stat{
    padding:22px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:15px;
    background:rgba(255,255,255,.025);
}

.stat small{
    color:#777;
    font-size:7px;
    letter-spacing:2px;
}

.stat strong{
    display:block;
    margin-top:10px;
    color:#e5c477;
    font:700 30px Georgia,serif;
}


/* ================= TOOLBAR ================= */

.toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.filter{
    padding:12px 15px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:8px;
    background:#101014;
    color:#ddd;
    outline:none;
}


/* ================= REQUESTS ================= */

.requests{
    display:grid;
    gap:15px;
}

.empty{
    padding:60px 20px;
    text-align:center;
    border:1px dashed rgba(255,255,255,.12);
    border-radius:18px;
    color:#666;
}

.request{
    padding:25px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.015)
        );
}

.request-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    padding-bottom:20px;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.appointment-id{
    color:#e5c477;
    font:700 22px Georgia,serif;
}

.status{
    padding:7px 11px;
    border-radius:30px;
    font-size:7px;
    letter-spacing:1.5px;
    font-weight:bold;
    border:1px solid rgba(229,196,119,.25);
    color:#e5c477;
    background:rgba(229,196,119,.07);
}

.details{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1px;
    margin-top:20px;
    background:rgba(255,255,255,.07);
}

.detail{
    padding:17px;
    background:#0b0b0e;
}

.detail small{
    display:block;
    margin-bottom:7px;
    color:#666;
    font-size:6px;
    letter-spacing:2px;
}

.detail strong{
    color:#eee;
    font-size:11px;
    overflow-wrap:anywhere;
}

.description{
    margin-top:18px;
    padding:16px;
    border-radius:9px;
    background:rgba(255,255,255,.025);
    color:#999;
    font-size:10px;
    line-height:1.7;
}

.actions{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    margin-top:20px;
}

.action{
    border:0;
    border-radius:8px;
    padding:12px 16px;
    cursor:pointer;
    font-size:8px;
    font-weight:bold;
    letter-spacing:1px;
    transition:.25s;
}

.action:hover{
    transform:translateY(-2px);
}

.confirm{
    background:#e5c477;
    color:#111;
}

.reject{
    background:#29151b;
    color:#e58b9b;
    border:1px solid rgba(229,139,155,.2);
}

.delete{
    background:#151519;
    color:#777;
    border:1px solid rgba(255,255,255,.08);
}

.confirmed{
    border-color:rgba(90,190,130,.25);
}

.confirmed .status{
    color:#7dd9a2;
    border-color:rgba(90,190,130,.25);
    background:rgba(90,190,130,.06);
}

.rejected{
    opacity:.65;
}

.rejected .status{
    color:#e58b9b;
    border-color:rgba(229,139,155,.25);
}


/* ================= NOTIFICATION ================= */

.new-request{
    animation:newRequestGlow 1.5s ease;
}

@keyframes newRequestGlow{
    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.01);
    }

    100%{
        transform:scale(1);
    }
}


/* ================= MOBILE ================= */

@media(max-width:850px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .details{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:550px){

    .header{
        padding:16px 18px;
    }

    .brand h1{
        font-size:15px;
    }

    .admin-label{
        font-size:6px;
    }

    .container{
        width:calc(100% - 30px);
        margin-top:30px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .details{
        grid-template-columns:1fr;
    }

    .request{
        padding:17px;
    }

    .request-top{
        flex-direction:column;
    }

    .actions .action{
        width:100%;
    }

    .office-control{
        align-items:flex-start;
        flex-direction:column;
    }

    .office-button{
        width:100%;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="brand">

        <h1>
            ASHA SAHITYA SRIJAN
        </h1>

        <span>
            PUBLICATION • ADMIN SYSTEM
        </span>

    </div>

    <div class="admin-label">
        ADMIN PANEL
    </div>

</header>



<main class="container">


    <div class="heading">

        <small>
            APPOINTMENT MANAGEMENT
        </small>

        <h2>
            Customer
            <span>Requests.</span>
        </h2>

    </div>



    <!-- ================= OFFICE CONTROL ================= -->

    <section class="office-control">

        <div class="office-info">

            <small>
                OFFICE STATUS
            </small>

            <strong id="officeStatusText">
                OFFICE OPEN
            </strong>

            <div class="office-help">
                Helpline: 9407909813
            </div>

        </div>


        <button
            id="officeToggle"
            class="office-button office-open"
            type="button"
            onclick="toggleOffice()"
        >
            OFFICE OPEN
        </button>

    </section>



    <!-- ================= STATS ================= -->

    <section class="stats">

        <div class="stat">

            <small>
                TOTAL REQUESTS
            </small>

            <strong id="total">
                0
            </strong>

        </div>


        <div class="stat">

            <small>
                PENDING
            </small>

            <strong id="pending">
                0
            </strong>

        </div>


        <div class="stat">

            <small>
                CONFIRMED
            </small>

            <strong id="confirmed">
                0
            </strong>

        </div>


        <div class="stat">

            <small>
                REJECTED
            </small>

            <strong id="rejected">
                0
            </strong>

        </div>

    </section>



    <!-- ================= FILTER ================= -->

    <div class="toolbar">

        <select
            id="filter"
            class="filter"
        >

            <option value="ALL">
                ALL REQUESTS
            </option>

            <option value="PENDING">
                PENDING
            </option>

            <option value="CONFIRMED">
                CONFIRMED
            </option>

            <option value="REJECTED">
                REJECTED
            </option>

        </select>

    </div>



    <!-- ================= REQUESTS ================= -->

    <section
        id="requests"
        class="requests"
    ></section>


</main>



<script>


/* =========================================================
   ELEMENTS
========================================================= */

const requestsBox =
    document.getElementById("requests");

const filter =
    document.getElementById("filter");

const officeToggle =
    document.getElementById("officeToggle");

const officeStatusText =
    document.getElementById("officeStatusText");


/* =========================================================
   BOOKINGS
========================================================= */

function getBookings(){

    return JSON.parse(
        localStorage.getItem(
            "ASS_ALL_BOOKINGS"
        )
    ) || [];

}


function saveBookings(bookings){

    localStorage.setItem(
        "ASS_ALL_BOOKINGS",
        JSON.stringify(bookings)
    );

}


/* =========================================================
   OFFICE STATUS
========================================================= */

function getOfficeStatus(){

    return localStorage.getItem(
        "ASS_OFFICE_STATUS"
    ) || "OPEN";

}


function updateOfficeUI(){

    const status =
        getOfficeStatus();


    if(status === "OPEN"){

        officeStatusText.textContent =
            "OFFICE OPEN";

        officeToggle.textContent =
            "OFFICE OPEN";

        officeToggle.className =
            "office-button office-open";

    }else{

        officeStatusText.textContent =
            "OFFICE CLOSED";

        officeToggle.textContent =
            "OFFICE CLOSED";

        officeToggle.className =
            "office-button office-closed";

    }

}


function toggleOffice(){

    const current =
        getOfficeStatus();


    const next =
        current === "OPEN"
            ? "CLOSED"
            : "OPEN";


    localStorage.setItem(
        "ASS_OFFICE_STATUS",
        next
    );


    updateOfficeUI();


    if(next === "OPEN"){

        alert(
            "Office is now OPEN."
        );

    }else{

        alert(
            "Office is now CLOSED.\n\nCustomer booking will be blocked."
        );

    }

}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(date){

    if(!date){
        return "—";
    }


    const parts =
        date.split("-");


    const months = [

        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"

    ];


    return (
        parts[2] +
        " " +
        months[
            Number(parts[1]) - 1
        ] +
        " " +
        parts[0]
    );

}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    const bookings =
        getBookings();


    document.getElementById(
        "total"
    ).textContent =
        bookings.length;


    document.getElementById(
        "pending"
    ).textContent =
        bookings.filter(
            b =>
                b.status === "PENDING"
        ).length;


    document.getElementById(
        "confirmed"
    ).textContent =
        bookings.filter(
            b =>
                b.status === "CONFIRMED"
        ).length;


    document.getElementById(
        "rejected"
    ).textContent =
        bookings.filter(
            b =>
                b.status === "REJECTED"
        ).length;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    if(
        value === undefined ||
        value === null
    ){

        return "";

    }


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const bookings =
        getBookings();


    const selected =
        filter.value;


    requestsBox.innerHTML =
        "";


    const filtered =
        bookings.filter(
            booking => {

                if(
                    selected === "ALL"
                ){

                    return true;

                }


                return (
                    booking.status ===
                    selected
                );

            }
        );


    if(
        filtered.length === 0
    ){

        requestsBox.innerHTML = `

            <div class="empty">

                No appointment requests found.

            </div>

        `;


        updateStats();

        return;

    }


    filtered
        .slice()
        .reverse()
        .forEach(
            booking => {

                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "request " +
                    (
                        booking.status ||
                        "PENDING"
                    ).toLowerCase();


                let paymentText;


                if(
                    booking.payment ===
                    "Pay Online Now"
                ){

                    paymentText =
                        "?20 — ONLINE";

                }else{

                    paymentText =
                        "?20 — AFTER MEET";

                }


                card.innerHTML = `

                    <div class="request-top">

                        <div>

                            <div class="appointment-id">

                                #${escapeHTML(
                                    booking.id
                                )}

                            </div>

                        </div>


                        <div class="status">

                            ${escapeHTML(
                                booking.status
                            )}

                        </div>

                    </div>



                    <div class="details">


                        <div class="detail">

                            <small>
                                CUSTOMER
                            </small>

                            <strong>
                                ${escapeHTML(
                                    booking.name
                                )}
                            </strong>

                        </div>



                        <div class="detail">

                            <small>
                                MOBILE
                            </small>

                            <strong>
                                ${escapeHTML(
                                    booking.phone
                                )}
                            </strong>

                        </div>



                        <div class="detail">

                            <small>
                                WORK
                            </small>

                            <strong>
                                ${escapeHTML(
                                    booking.work
                                )}
                            </strong>

                        </div>



                        <div class="detail">

                            <small>
                                DATE
                            </small>

                            <strong>
                                ${formatDate(
                                    booking.date
                                )}
                            </strong>

                        </div>



                        <div class="detail">

                            <small>
                                TIME SLOT
                            </small>

                            <strong>
                                ${escapeHTML(
                                    booking.slot
                                )}
                            </strong>

                        </div>



                        <div class="detail">

                            <small>
                                PAYMENT
                            </small>

                            <strong>
                                ${paymentText}
                            </strong>

                        </div>



                        <div class="detail">

                            <small>
                                UTR / REFERENCE
                            </small>

                            <strong>

                                ${
                                    booking.utr
                                        ?
                                    escapeHTML(
                                        booking.utr
                                    )
                                        :
                                    (
                                        booking.payment ===
                                        "Pay After Meet"
                                            ?
                                        "Not required"
                                            :
                                        "Not submitted"
                                    )
                                }

                            </strong>

                        </div>


                    </div>



                    <div class="description">

                        <strong>
                            PROJECT DETAILS
                        </strong>

                        <br><br>

                        ${
                            booking.details
                                ?
                            escapeHTML(
                                booking.details
                            )
                                :
                            "No additional details provided."
                        }

                    </div>



                    <div class="actions">


                        ${
                            booking.status !==
                            "CONFIRMED"

                                ?

                            `

                            <button
                                class="action confirm"
                                onclick="confirmBooking('${escapeHTML(
                                    booking.id
                                )}')"
                            >

                                CONFIRM APPOINTMENT

                            </button>

                            `

                                :

                            ""

                        }



                        ${
                            booking.status !==
                            "REJECTED"

                                ?

                            `

                            <button
                                class="action reject"
                                onclick="rejectBooking('${escapeHTML(
                                    booking.id
                                )}')"
                            >

                                REJECT

                            </button>

                            `

                                :

                            ""

                        }



                        <button
                            class="action delete"
                            onclick="deleteBooking('${escapeHTML(
                                booking.id
                            )}')"
                        >

                            DELETE

                        </button>


                    </div>

                `;


                requestsBox.appendChild(
                    card
                );

            }
        );


    updateStats();

}


/* =========================================================
   CONFIRM
========================================================= */

function confirmBooking(id){

    const bookings =
        getBookings();


    const booking =
        bookings.find(
            b =>
                b.id === id
        );


    if(!booking){
        return;
    }


    booking.status =
        "CONFIRMED";


    saveBookings(
        bookings
    );


    const current =
        JSON.parse(
            localStorage.getItem(
                "ASS_CURRENT_BOOKING"
            )
        );


    if(
        current &&
        current.id === id
    ){

        current.status =
            "CONFIRMED";


        localStorage.setItem(
            "ASS_CURRENT_BOOKING",
            JSON.stringify(
                current
            )
        );

    }


    render();


    alert(
        "Appointment confirmed successfully."
    );

}


/* =========================================================
   REJECT
========================================================= */

function rejectBooking(id){

    const bookings =
        getBookings();


    const booking =
        bookings.find(
            b =>
                b.id === id
        );


    if(!booking){
        return;
    }


    const yes =
        confirm(
            "Are you sure you want to reject this appointment?"
        );


    if(!yes){
        return;
    }


    booking.status =
        "REJECTED";


    saveBookings(
        bookings
    );


    const current =
        JSON.parse(
            localStorage.getItem(
                "ASS_CURRENT_BOOKING"
            )
        );


    if(
        current &&
        current.id === id
    ){

        current.status =
            "REJECTED";


        localStorage.setItem(
            "ASS_CURRENT_BOOKING",
            JSON.stringify(
                current
            )
        );

    }


    render();

}


/* =========================================================
   DELETE
========================================================= */

function deleteBooking(id){

    const yes =
        confirm(
            "Delete this appointment permanently?"
        );


    if(!yes){
        return;
    }


    let bookings =
        getBookings();


    bookings =
        bookings.filter(
            b =>
                b.id !== id
        );


    saveBookings(
        bookings
    );


    render();

}


/* =========================================================
   FILTER
========================================================= */

filter.addEventListener(
    "change",
    render
);


/* =========================================================
   AUTO REFRESH
========================================================= */

let lastBookingCount =
    getBookings().length;


setInterval(
    () => {

        const currentCount =
            getBookings().length;


        if(
            currentCount >
            lastBookingCount
        ){

            lastBookingCount =
                currentCount;


            render();

        }else{

            render();

        }

    },
    3000
);


/* =========================================================
   INITIAL LOAD
========================================================= */

updateOfficeUI();

render();

</script>

</body>
</html>
